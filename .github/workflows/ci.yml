name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio.example

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Portfolio.Api/Portfolio.Api.csproj
      - run: dotnet restore backend/Portfolio.Tests/Portfolio.Tests.csproj
      - run: dotnet test backend/Portfolio.Tests/Portfolio.Tests.csproj --no-restore --configuration Release
      - run: dotnet build backend/Portfolio.Api/Portfolio.Api.csproj --no-restore --configuration Release
      - run: docker compose config --quiet
